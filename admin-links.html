<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EdgeLink - 所有短链接</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">

  <!-- Self-hosted Fonts (no Google Fonts dependency) -->
  <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts.css">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Local QR Code Library (0ms latency, offline-capable) -->
  <script src="qrcode.min.js" defer></script>
</head>
<body class="dark-mode">
  <div class="bg-glow"></div>

  <div class="container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <span class="logo-icon">⚙️</span>
        <h1 class="logo-text">Edge<span>Link Admin</span></h1>
      </div>
      <p class="tagline">所有短链接管理</p>
    </header>

    <!-- Content Area -->
    <main class="app-content">

      <div class="card glass">
        <div class="card-header flex-header">
          <div>
            <h2>所有短链接</h2>
            <p id="alSummary">正在加载 KV 数据...</p>
          </div>
          <div class="header-actions">
            <a href="/admin" class="btn btn-secondary" style="text-decoration:none;">← 返回管理后台</a>
            <input type="text" id="alSearchInput" oninput="alFilter()" placeholder="搜索短地址/内容..." class="search-input">
            <button onclick="alExportCSV()" class="btn btn-secondary">📥 导出CSV</button>
            <button id="alBtnBulkDelete" onclick="alBulkDelete()" class="btn btn-danger hidden">🗑️ 批量删除 (<span id="alSelectedCount">0</span>)</button>
            <button onclick="alReload()" class="btn btn-secondary">🔄 刷新</button>
          </div>
        </div>
        <div class="pagination-bar" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;">
          <label style="font-size:0.9rem;color:var(--text-secondary);">每页显示
            <input type="number" id="alPageSize" min="1" max="500" value="30" style="width:70px;margin:0 6px;padding:6px 8px;background:rgba(0,0,0,0.25);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);">
            条
          </label>
          <button onclick="alChangePage(-1)" id="alBtnPrev" class="btn btn-secondary" style="width:auto;padding:6px 14px;">← 上一页</button>
          <span id="alPageInfo" style="font-size:0.9rem;color:var(--text-secondary);">- / -</span>
          <button onclick="alChangePage(1)" id="alBtnNext" class="btn btn-secondary" style="width:auto;padding:6px 14px;">下一页 →</button>
        </div>
      </div>

      <div class="card glass">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th style="width: 40px; text-align: center;"><input type="checkbox" id="alSelectAll" onchange="alToggleSelectAll(this)" style="cursor: pointer;"></th>
                <th>短地址</th>
                <th>类型</th>
                <th>内容/原始链接</th>
                <th>状态 (点击)</th>
                <th>次数限制</th>
                <th>创建时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="alLinksList">
              <tr class="empty-row"><td colspan="8">正在加载 KV 数据...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>© 2026 EdgeLink Admin | <a href="/admin" style="color:var(--accent-color);">返回管理后台</a></p>
    </footer>
  </div>

  <!-- QR Code Modal -->
  <div id="qrModal" class="modal hidden">
    <div class="modal-overlay" onclick="alCloseQRModal()"></div>
    <div class="modal-content glass">
      <div class="modal-header">
        <h3>短链接二维码</h3>
        <button class="close-btn" onclick="alCloseQRModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="qrcodeContainer"></div>
        <p id="qrUrlText"></p>
        <small>扫描上方二维码即可直接在手机端打开短链接。</small>
      </div>
      <div class="modal-footer">
        <button id="btnDownloadQR" class="btn btn-secondary">下载二维码</button>
        <button onclick="alCloseQRModal()" class="btn btn-primary">关闭</button>
      </div>
    </div>
  </div>

  <!-- Text Preview Modal -->
  <div id="previewModal" class="modal hidden">
    <div class="modal-overlay" onclick="alClosePreview()"></div>
    <div class="modal-content glass" style="max-width: 600px; text-align: left;">
      <div class="modal-header">
        <h3>文字内容预览</h3>
        <button class="close-btn" onclick="alClosePreview()">&times;</button>
      </div>
      <div class="modal-body" style="align-items: stretch;">
        <div class="badge" id="alPreviewBadge" style="margin-bottom: 12px; display: inline-flex; width: fit-content; border: 1px solid rgba(190, 100, 50, 0.2); background: rgba(190, 100, 50, 0.08); color: var(--accent-color); padding: 4px 10px; border-radius: 4px; font-size: 0.8rem;"></div>
        <pre id="alPreviewText" style="background: rgba(0, 0, 0, 0.3); padding: 15px; border-radius: var(--radius-md); border: 1px solid var(--border-color); font-family: var(--font-mono); font-size: 0.9rem; color: var(--text-primary); white-space: pre-wrap; word-break: break-all; max-height: 350px; overflow-y: auto;"></pre>
      </div>
      <div class="modal-footer">
        <button onclick="alCopyPreview()" class="btn btn-primary" style="flex: 1;">复制文本</button>
        <button onclick="alClosePreview()" class="btn btn-secondary" style="flex: 1;">关闭</button>
      </div>
    </div>
  </div>

  <!-- Toast Notifications Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="admin-links.js" defer></script>
</body>
</html>
