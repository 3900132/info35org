<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EdgeLink - 用户中心</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👤</text></svg>">

  <!-- Self-hosted Fonts (no Google Fonts dependency) -->
  <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts.css">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
  <div class="bg-glow"></div>

  <div class="container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <span class="logo-icon">⚡</span>
        <h1 class="logo-text">Edge<span>Link</span></h1>
      </div>
      <p class="tagline">用户中心 - 我的短链管理</p>
    </header>

    <!-- Content Area -->
    <main class="app-content">

      <!-- Not logged in -->
      <div id="notLoggedIn" class="card glass hidden">
        <div class="card-header">
          <h2>尚未登录</h2>
          <p>请先返回首页登录后再查看您的短链。</p>
        </div>
        <a href="/" class="btn btn-primary" style="width:100%;text-decoration:none;">返回首页登录</a>
      </div>

      <!-- Logged in -->
      <div id="userCenterMain" class="hidden">
        <!-- Account Card -->
        <div class="card glass">
          <div class="card-header flex-header">
            <div>
              <h2>👋 欢迎回来，<span id="ucDisplayName"></span></h2>
              <p id="ucSummary">正在加载您的短链数据...</p>
            </div>
            <div class="header-actions">
              <a href="/" class="btn btn-secondary" style="text-decoration:none;">⚡ 生成短链</a>
              <button onclick="ucLogout()" class="btn btn-danger">退出登录</button>
            </div>
          </div>
        </div>

        <!-- Links Card -->
        <div class="card glass">
          <div class="card-header">
            <h2>📋 我的短链</h2>
            <div class="pagination-bar" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;">
              <label style="font-size:0.9rem;color:var(--text-secondary);">每页显示
                <input type="number" id="ucPageSize" min="1" max="500" value="30" style="width:70px;margin:0 6px;padding:6px 8px;background:rgba(0,0,0,0.25);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);">
                条
              </label>
              <button onclick="ucChangePage(-1)" id="ucBtnPrev" class="btn btn-secondary" style="width:auto;padding:6px 14px;">← 上一页</button>
              <span id="ucPageInfo" style="font-size:0.9rem;color:var(--text-secondary);">- / -</span>
              <button onclick="ucChangePage(1)" id="ucBtnNext" class="btn btn-secondary" style="width:auto;padding:6px 14px;">下一页 →</button>
              <button onclick="ucReload()" class="btn btn-secondary" style="width:auto;padding:6px 14px;">🔄 刷新</button>
            </div>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>短地址</th>
                  <th>类型</th>
                  <th>原始地址/内容</th>
                  <th>状态 (点击)</th>
                  <th>次数限制</th>
                  <th>创建时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="ucLinksList"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>© 2026 EdgeLink | <a href="/" style="color:var(--accent-color);">返回首页</a></p>
    </footer>
  </div>

  <!-- Edit Link Modal (Hidden by default) -->
  <div id="editModal" class="modal hidden">
    <div class="modal-overlay" onclick="ucCloseEditModal()"></div>
    <div class="modal-content glass">
      <div class="modal-header">
        <h3>编辑短链内容</h3>
        <button class="close-btn" onclick="ucCloseEditModal()">&times;</button>
      </div>
      <div class="modal-body" style="align-items:stretch;text-align:left;">
        <p id="editShortCodeText" style="margin:0;font-size:0.9rem;color:var(--text-secondary);"></p>
        <div class="form-group" style="margin:0;">
          <label for="editContentInput">新的原始链接 / 文字内容 <span class="required">*</span></label>
          <div class="input-wrapper">
            <span class="input-icon" style="top: 14px; align-self: flex-start;">🌐</span>
            <textarea id="editContentInput" required style="height: 100px; resize: vertical; padding-top: 14px;"></textarea>
          </div>
          <small class="helper-text">以 http(s):// 开头将保存为链接跳转，否则保存为文字分享。点击统计与有效期保持不变。</small>
        </div>
      </div>
      <div class="modal-footer">
        <button onclick="ucCloseEditModal()" class="btn btn-secondary">取消</button>
        <button id="btnSaveEdit" onclick="ucSaveEdit()" class="btn btn-primary">保存修改</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirm Modal (Hidden by default) -->
  <div id="deleteConfirmModal" class="modal hidden">
    <div class="modal-overlay" onclick="ucCloseDeleteConfirm()"></div>
    <div class="modal-content glass">
      <div class="modal-header">
        <h3>⚠️ 确认删除</h3>
        <button class="close-btn" onclick="ucCloseDeleteConfirm()">&times;</button>
      </div>
      <div class="modal-body">
        <p id="deleteConfirmText" style="margin:0;font-size:0.95rem;line-height:1.6;color:var(--text-primary);"></p>
        <small style="color:var(--text-secondary);">删除后该短链将从 KV 存储中永久移除，访问立即失效且不可恢复。</small>
      </div>
      <div class="modal-footer">
        <button onclick="ucCloseDeleteConfirm()" class="btn btn-secondary">取消</button>
        <button onclick="ucConfirmDeleteAction()" class="btn btn-danger">确认删除</button>
      </div>
    </div>
  </div>

  <!-- QR Code Modal (Hidden by default) -->
  <div id="ucQrModal" class="modal hidden">
    <div class="modal-overlay" onclick="ucCloseQRModal()"></div>
    <div class="modal-content glass">
      <div class="modal-header">
        <h3>短链接二维码</h3>
        <button class="close-btn" onclick="ucCloseQRModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="ucQrcodeContainer"></div>
        <p id="ucQrUrlText"></p>
        <small>扫描上方二维码即可直接在手机端打开短链接。</small>
      </div>
      <div class="modal-footer">
        <button id="ucBtnDownloadQR" class="btn btn-secondary">下载二维码</button>
        <button onclick="ucCloseQRModal()" class="btn btn-primary">关闭</button>
      </div>
    </div>
  </div>

  <!-- Toast Notifications Container -->
  <div id="toastContainer" style="position:fixed;top:20px;right:20px;z-index:9999;"></div>

  <!-- Local QR Code Library -->
  <script src="qrcode.min.js" defer></script>
  <script src="user-center.js" defer></script>
</body>
</html>
